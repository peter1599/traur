name: Release main builds

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Test, build, and release
    runs-on: ubuntu-latest

    steps:
      - name: Check out commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Determine release type
        id: release_metadata
        env:
          COMMIT_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail

          version=$(sed -n 's/^version = "\([^\"]*\)"/\1/p' Cargo.toml | head -n 1)
          test -n "${version}"
          short_sha="${COMMIT_SHA:0:12}"

          mapfile -t release_types < <(
            git show -s --format='%(trailers:key=Release-Type,valueonly,unfold)' "${COMMIT_SHA}" |
              sed -e '/^[[:space:]]*$/d' -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'
          )
          if (( ${#release_types[@]} > 1 )); then
            echo "Multiple Release-Type trailers found; use one." >&2
            exit 1
          fi

          requested_type="${release_types[0]:-prerelease}"
          requested_type="${requested_type,,}"
          case "${requested_type}" in
            stable|release)
              release_type=stable
              pkgver="${version}"
              tag="v${version}"
              prerelease=false
              ;;
            prerelease)
              release_type=prerelease
              pkgver="${version}.r${RUN_NUMBER}"
              tag="v${version}-${short_sha}"
              prerelease=true
              ;;
            *)
              echo "Unsupported Release-Type: ${requested_type}" >&2
              echo "Use stable or prerelease." >&2
              exit 1
              ;;
          esac

          title="v${version}"
          {
            echo "release_type=${release_type}"
            echo "pkgver=${pkgver}"
            echo "tag=${tag}"
            echo "title=${title}"
            echo "prerelease=${prerelease}"
          } >> "${GITHUB_OUTPUT}"
          echo "Release type: ${release_type}"
          echo "Release tag: ${tag}"

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable

      - name: Run tests
        run: cargo test --locked

      - name: Build installable Arch package
        env:
          COMMIT_SHA: ${{ github.sha }}
          PKGVER: ${{ steps.release_metadata.outputs.pkgver }}
        run: |
          set -euo pipefail

          docker run --rm --interactive \
            --env GITHUB_SHA="${COMMIT_SHA}" \
            --env PACKAGE_VERSION="${PKGVER}" \
            --env GITHUB_REPOSITORY="${GITHUB_REPOSITORY}" \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --workdir /workspace \
            archlinux:base-devel \
            bash -euo pipefail <<'CONTAINER_SCRIPT'
          pacman -Syu --noconfirm --needed git rust cargo zstd

          host_uid=$(stat -c '%u' /workspace)
          useradd --create-home --uid "${host_uid}" builder
          chown -R "${host_uid}" /workspace

          cat > /tmp/build-traur-package.sh <<'BUILD_SCRIPT'
          set -euo pipefail

          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          pkgver="${PACKAGE_VERSION}"
          workdir=$(mktemp -d)
          trap 'rm -rf "${workdir}"' EXIT

          archive="${workdir}/traur-${pkgver}.tar.gz"
          git archive --format=tar.gz --prefix="traur-${pkgver}/" "${GITHUB_SHA}" > "${archive}"
          checksum=$(sha256sum "${archive}" | awk '{print $1}')

          mkdir -p "${workdir}/package"
          cp pkg/PKGBUILD "${workdir}/package/PKGBUILD"
          cp "${archive}" "${workdir}/package/"
          sed -i \
            -e "s/^pkgver=.*/pkgver=${pkgver}/" \
            -e "s|^url=.*|url='https://github.com/${GITHUB_REPOSITORY}'|" \
            -e "s|^source=.*|source=('traur-${pkgver}.tar.gz')|" \
            -e "s|^sha256sums=.*|sha256sums=('${checksum}')|" \
            "${workdir}/package/PKGBUILD"
          printf '%s\n' "options=('!debug')" >> "${workdir}/package/PKGBUILD"

          cd "${workdir}/package"
          makepkg --noconfirm --clean --cleanbuild
          main_package=$(find . -maxdepth 1 -type f -name "traur-${pkgver}-*.pkg.tar.*" -print -quit)
          test -n "${main_package}"
          mkdir -p /workspace/dist
          cp "${main_package}" /workspace/dist/
          BUILD_SCRIPT
          chmod +x /tmp/build-traur-package.sh
          runuser -u builder -- env \
            HOME=/home/builder \
            GITHUB_SHA="${GITHUB_SHA}" \
            PACKAGE_VERSION="${PACKAGE_VERSION}" \
            GITHUB_REPOSITORY="${GITHUB_REPOSITORY}" \
            /tmp/build-traur-package.sh
          CONTAINER_SCRIPT

          asset=$(find dist -maxdepth 1 -type f -name "traur-${PKGVER}-*.pkg.tar.*" -print -quit)
          test -n "${asset}"
          asset_name=$(basename "${asset}")
          (cd dist && sha256sum "${asset_name}" > "${asset_name}.sha256")

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ steps.release_metadata.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release_metadata.outputs.title }}
          PACKAGE_VERSION: ${{ steps.release_metadata.outputs.pkgver }}
          PRERELEASE: ${{ steps.release_metadata.outputs.prerelease }}
        run: |
          set -euo pipefail

          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          short_sha=${COMMIT_SHA:0:12}
          tag="${RELEASE_TAG}"
          title="${RELEASE_TITLE}"
          notes_file="${RUNNER_TEMP}/release-notes.md"
          git log -1 --format=%B "${COMMIT_SHA}" > "${notes_file}"

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; nothing to do."
            exit 0
          fi

          asset=$(find dist -maxdepth 1 -type f -name "traur-${PACKAGE_VERSION}-*.pkg.tar.*" -print -quit)
          test -n "${asset}"

          release_args=(
            "${tag}"
            "${asset}"
            "${asset}.sha256"
            --target "${COMMIT_SHA}"
            --title "${title}"
            --notes-file "${notes_file}"
          )
          if [[ "${PRERELEASE}" == "true" ]]; then
            release_args+=(--prerelease)
          fi

          gh release create "${release_args[@]}"
